name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          # Same public Neon HTTPS URL as ks-sw-dashboard_test (no credentials).
          # Optional override: repo secret VITE_NEON_URL
          VITE_NEON_URL: ${{ secrets.VITE_NEON_URL || 'https://ep-divine-meadow-azqo19a2.c-3.ap-southeast-1.aws.neon.tech/neondb' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Optional Test Reports GitHub upload token (public in SPA — prefer session paste).
          VITE_GH_UPLOAD_TOKEN: ${{ secrets.VITE_GH_UPLOAD_TOKEN }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || 'chungalbert/ks-sw-dashboard' }}
          VITE_GITHUB_BRANCH: ${{ vars.VITE_GITHUB_BRANCH || 'main' }}
      - run: npm run build
        env:
          VITE_NEON_URL: ${{ secrets.VITE_NEON_URL || 'https://ep-divine-meadow-azqo19a2.c-3.ap-southeast-1.aws.neon.tech/neondb' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GH_UPLOAD_TOKEN: ${{ secrets.VITE_GH_UPLOAD_TOKEN }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO || 'chungalbert/ks-sw-dashboard' }}
          VITE_GITHUB_BRANCH: ${{ vars.VITE_GITHUB_BRANCH || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
